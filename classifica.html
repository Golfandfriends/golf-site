<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<script>
(function(){
  var ROLE_KEY='gfRole';
  var role = localStorage.getItem(ROLE_KEY);
  if (role !== 'player' && role !== 'admin') {
    location.replace('login.html?next=' + encodeURIComponent(location.pathname + location.search));
  } else {
    window.addEventListener('DOMContentLoaded', function(){
      var btn = document.createElement('a');
      btn.href = '#';
      btn.textContent = role === 'admin' ? 'Esci (admin)' : 'Esci';
      btn.setAttribute('style','position:fixed;bottom:12px;right:12px;background:#001e3c;color:#fff;padding:6px 12px;border-radius:6px;font-size:12px;font-family:Inter,sans-serif;text-decoration:none;z-index:9999;opacity:0.85;');
      btn.onclick = function(e){
        e.preventDefault();
        localStorage.removeItem(ROLE_KEY);
        location.href='login.html';
      };
      document.body.appendChild(btn);
    });
  }
})();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Classifica gare — Golf & Friends</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=45">
</head>
<body class="turf-bg">

<nav class="site-nav">
  <div class="wrap">
    <a class="brand" href="index.html"><img src="img/logo.svg" class="brand-icon" alt="Golf &amp; Friends"></a>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="classifica.html">Classifica gare</a>
      <a href="calendario.html">Calendario</a>
      <a href="money-list.html">Money List</a>
      <a href="premi.html">Tab Premi</a>
      <a href="giocatori.html">Giocatori</a>
      <a href="statistiche.html">Statistiche</a>
      <a href="galleria.html">Galleria</a>
      <a href="statuto.html">Statuto</a>
    </div>
  </div>
</nav>

<header class="hero" style="padding-bottom:12px;">
  <div class="wrap">
    <h1 style="font-size:2.2rem;">Classifica gare</h1>
  </div>
</header>

<main class="wrap" id="gare-container">
  <p class="muted">Caricamento gare…</p>
</main>

<footer class="site-footer">
  <div class="wrap">
    <span>Golf & Friends — sito del gruppo, gestito tra amici.</span>
    <span>Dati modificabili in <code>/data/data.json</code></span>
  </div>
</footer>

<script src="js/common.js?v=46"></script>
<script>
(async function () {
  const data = await loadData();
  const container = document.getElementById("gare-container");
  const gare = [...data.gare].sort((a, b) => new Date(b.data) - new Date(a.data));

  if (gare.length === 0) {
    container.innerHTML = `<div class="empty-state">Nessuna gara registrata ancora.</div>`;
    return;
  }

  container.innerHTML = gare
    .map((gara) => {
      const righe = calcolaClassificaGara(data, gara);
      return `
      <section class="card" style="margin-bottom:28px;">
        <div class="card-header">
          <div>
            <h2>${gara.nome}</h2>
            <span class="meta">${formatDateIt(gara.data)}</span>
          </div>
          <div class="flex" style="gap:8px;">
            <span class="pill">${gara.formato}</span>
            <span class="pill">${gara.buca} buche</span>
            <span class="pill gold">Quota 10€</span>
          </div>
        </div>
        <div class="card-body" style="overflow-x:auto;">
          <table class="scorecard only-desktop">
            <thead>
              <tr>
                <th class="num">Pos</th>
                <th>Giocatore</th>
                <th class="num">Lordo</th>
                <th class="num">HCP EGA</th>
                <th class="num">HCP gioco</th>
                <th class="num">Netto</th>
                <th class="num">Premio</th>
              </tr>
            </thead>
            <tbody>
              ${righe
                .map((r) => {
                  const scatolette = calcolaPremio(data, righe.length, r.posizione);
                  return `
                <tr class="pos-${r.posizione}">
                  <td class="num pos">${r.posizione}</td>
                  <td class="player-name">${r.nome}</td>
                  <td class="num">${r.lordo}</td>
                  <td class="num">${r.hcpEga.toFixed(1)}</td>
                  <td class="num">${r.hcpGioco}</td>
                  <td class="num"><strong>${r.netto}</strong></td>
                  <td class="num">${badgePremio(scatolette)}</td>
                </tr>`;
                })
                .join("")}
            </tbody>
          </table>

          <div class="only-mobile mobile-rows">
            ${righe
              .map((r) => {
                const scatolette = calcolaPremio(data, righe.length, r.posizione);
                return `
              <div class="mrow pos-${r.posizione}">
                <div class="mrow-pos">${r.posizione}</div>
                <div class="mrow-main">
                  <div class="mrow-nome player-name">${r.nome}</div>
                  <div class="mrow-sub">Lordo ${r.lordo} · HCP ${r.hcpEga.toFixed(1)} → ${r.hcpGioco}</div>
                </div>
                <div class="mrow-side">
                  <div class="mrow-netto">${r.netto}</div>
                  <div class="mrow-premio">${badgePremio(scatolette)}</div>
                </div>
              </div>`;
              })
              .join("")}
          </div>
          <p class="muted" style="margin-top:12px; margin-bottom:0; font-size:0.78rem;">
            Netto = Lordo − HCP di gioco · premi calcolati su ${righe.length} giocatori ·
            <a href="premi.html">vedi tabella completa</a>
          </p>
          <div style="margin-top:14px;">
            <a class="btn btn-whatsapp" href="${testoWhatsapp(gara, righe)}" target="_blank" rel="noopener">Condividi su WhatsApp</a>
          </div>
        </div>
      </section>`;
    })
    .join("");
})();
</script>
</body>
</html>
