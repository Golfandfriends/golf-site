<!DOCTYPE html>

<meta charset="UTF-8">
<script>
(function(){
  var ROLE_KEY='gfRole';
  var role = localStorage.getItem(ROLE_KEY);
  if (role !== 'player' && role !== 'admin') {
    location.replace('login.html?next=' + encodeURIComponent(location.pathname + location.search));
  } else {
    window.addEventListener('DOMContentLoaded', function(){
      var btn = document.createElement('a');
      btn.href = '#';
      btn.textContent = role === 'admin' ? 'Esci (admin)' : 'Esci';
      btn.setAttribute('style','position:fixed;bottom:12px;right:12px;background:#001e3c;color:#fff;padding:6px 12px;border-radius:6px;font-size:12px;font-family:Inter,sans-serif;text-decoration:none;z-index:9999;opacity:0.85;');
      btn.onclick = function(e){
        e.preventDefault();
        localStorage.removeItem(ROLE_KEY);
        location.href='login.html';
      };
      document.body.appendChild(btn);
    });
  }
})();
</script>

<header class="hero" style="padding-bottom:12px;">

<script src="js/common.js?v=52"></script>
<script>
(async function () {
  const data = await loadData();
  const container = document.getElementById("giocatori-container");
  const giocatori = [...data.giocatori].sort((a, b) => a.handicap - b.handicap);

  // Sotto questa soglia di gare giocate il mini-grafico non direbbe
  // nulla di significativo — scelta di Andrea, 13 novembre 2026: chi è
  // sotto resta fuori per ora (si rivaluta il prossimo anno).
  const SOGLIA_ANDAMENTO = 4;

  container.innerHTML = giocatori
    .map((p) => {
      const roundGiocati = data.gare.filter((g) => g.risultati.some((r) => r.giocatore === p.id)).length;
      const storico = storicoHcpGiocatore(data, p.id);

      let andamentoHtml = "";
      if (storico.length >= SOGLIA_ANDAMENTO) {
        const valori = storico.map((s) => s.hcpEga);
        const variazione = valori[valori.length - 1] - valori[0];
        // Verde se l'HCP è migliorato (sceso), rosso se è peggiorato
        // (salito), grigio neutro se è rimasto identico — riusa gli
        // stessi colori già presenti sul sito (verde di HCP gioco, rosso
        // del badge RIT), non ne introduce di nuovi.
        const colore = variazione < 0 ? "#00573f" : variazione > 0 ? "#8f3b2b" : "#5b6b76";
        const freccia = variazione < 0 ? "▼" : variazione > 0 ? "▲" : "→";
        const segno = variazione > 0 ? "+" : "";
        // Sul lato destro della card, accanto ad avatar/nome/HCP, per
        // riempire lo spazio altrimenti vuoto (richiesta di Andrea, 13
        // novembre 2026).
        andamentoHtml = `
        <div class="spark-col">
          ${sparklineSvg(valori, colore)}
          <span class="spark-delta" style="color:${colore};">${freccia} ${segno}${variazione.toFixed(1)}</span>
        </div>`;
      }

      return `
    <div class="player-card">
      <div class="player-card-top">
        <div class="player-card-info">
          <div class="avatar">${initials(p.nome)}</div>
          <h3 class="player-name">${p.nome}</h3>
          <div class="hcp">${p.handicap.toFixed(1)}</div>
          <p class="sub" style="margin-top:2px;">HCP EGA</p>
        </div>
        ${andamentoHtml}
      </div>
      <div class="flex" style="margin-top:10px; justify-content:space-between; align-items:flex-end;">
        <span class="pill sky">HCP gioco ${hcpGioco(hcpEgaEffettivo(p.handicap, p.tee))}</span>
        <p class="sub" style="margin:0;">Round giocati: ${roundGiocati}</p>
      </div>
    </div>`;
    })
    .join("");
})();
</script>
