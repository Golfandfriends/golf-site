<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<script>
(function(){
  var ROLE_KEY='gfRole';
  var role = localStorage.getItem(ROLE_KEY);
  if (role !== 'player' && role !== 'admin') {
    location.replace('login.html?next=' + encodeURIComponent(location.pathname + location.search));
  } else {
    window.addEventListener('DOMContentLoaded', function(){
      var btn = document.createElement('a');
      btn.href = '#';
      btn.textContent = role === 'admin' ? 'Esci (admin)' : 'Esci';
      btn.setAttribute('style','position:fixed;bottom:12px;right:12px;background:#001e3c;color:#fff;padding:6px 12px;border-radius:6px;font-size:12px;font-family:Inter,sans-serif;text-decoration:none;z-index:9999;opacity:0.85;');
      btn.onclick = function(e){
        e.preventDefault();
        localStorage.removeItem(ROLE_KEY);
        location.href='login.html';
      };
      document.body.appendChild(btn);
    });
  }
})();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Giocatori — Golf & Friends</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=48">
<link rel="icon" href="img/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="img/icon-180.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#001e3c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Golf & Friends">
</head>
<body class="turf-bg">

<nav class="site-nav">
  <div class="wrap">
    <a class="brand" href="index.html"><img src="img/logo.svg" class="brand-icon" alt="Golf &amp; Friends"></a>
    <div class="nav-links">
      <a href="index.html">Home</a>

      <a href="galleria.html">Galleria</a>
      <a href="statuto.html">Statuto</a>
    </div>

</nav>

<header class="hero" style="padding-bottom:12px;">
  <div class="wrap">
    <h1 style="font-size:2.2rem;">Giocatori</h1>
    <p class="lede">Handicap EGA del gruppo. Ogni giocatore è tenuto a comunicare ogni abbassamento/alzamento di HCP.</p>
  </div>
</header>

<main class="wrap">
  <div class="grid grid-3" id="giocatori-container"></div>
</main>

<footer class="site-footer">
  <div class="wrap">
    <span>Golf & Friends — sito del gruppo, gestito tra amici.</span>
    <span>Dati modificabili in <code>/data/data.json</code></span>
  </div>
</footer>

<script src="js/common.js?v=49"></script>
<script>
(async function () {
  const data = await loadData();
  const container = document.getElementById("giocatori-container");
  const giocatori = [...data.giocatori].sort((a, b) => a.handicap - b.handicap);

  container.innerHTML = giocatori
    .map((p) => {
      const roundGiocati = data.gare.filter((g) => g.risultati.some((r) => r.giocatore === p.id)).length;
      return `
    <div class="player-card">
      <div class="avatar">${initials(p.nome)}</div>
      <h3 class="player-name">${p.nome}</h3>
      <div class="hcp">${p.handicap.toFixed(1)}</div>
      <p class="sub" style="margin-top:2px;">HCP EGA</p>
      <div class="flex" style="margin-top:10px; justify-content:space-between; align-items:flex-end;">
        <span class="pill sky">HCP gioco ${hcpGioco(hcpEgaEffettivo(p.handicap, p.tee))}</span>
        <p class="sub" style="margin:0;">Round giocati: ${roundGiocati}</p>
      </div>
    </div>`;
    })
    .join("");
})();
</script>
</body>
</html>
