<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<script>
(function(){
  var ROLE_KEY='gfRole';
  var role = localStorage.getItem(ROLE_KEY);
  if (role !== 'player' && role !== 'admin') {
    location.replace('login.html?next=' + encodeURIComponent(location.pathname + location.search));
  } else {
    window.addEventListener('DOMContentLoaded', function(){
      var btn = document.createElement('a');
      btn.href = '#';
      btn.textContent = role === 'admin' ? 'Esci (admin)' : 'Esci';
      btn.setAttribute('style','position:fixed;bottom:12px;right:12px;background:#001e3c;color:#fff;padding:6px 12px;border-radius:6px;font-size:12px;font-family:Inter,sans-serif;text-decoration:none;z-index:9999;opacity:0.85;');
      btn.onclick = function(e){
        e.preventDefault();
        localStorage.removeItem(ROLE_KEY);
        location.href='login.html';
      };
      document.body.appendChild(btn);
    });
  }
})();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Money List — Golf & Friends</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=45">
</head>
<body class="turf-bg">

<nav class="site-nav">
  <div class="wrap">
    <a class="brand" href="index.html"><img src="img/logo.svg" class="brand-icon" alt="Golf &amp; Friends"></a>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="classifica.html">Classifica gare</a>
      <a href="calendario.html">Calendario</a>
      <a href="money-list.html">Money List</a>
      <a href="premi.html">Tab Premi</a>
      <a href="giocatori.html">Giocatori</a>
      <a href="statistiche.html">Statistiche</a>
      <a href="galleria.html">Galleria</a>
      <a href="statuto.html">Statuto</a>
    </div>
  </div>
</nav>

<header class="hero" style="padding:32px 0 8px;">
  <div class="wrap" style="text-align:center; padding-bottom:0;">
    <h1 style="font-size:2.6rem; margin:0 auto 4px; max-width:none;" id="money-list-titolo">Golf &amp; Friends</h1>
    <p id="money-list-stagione" style="font-size:1.5rem; font-weight:600; color: var(--ink); margin:0;"></p>
  </div>
</header>

<main class="wrap">
  <section class="card leaderboard-card">
    <div class="card-header">
      <h3>Leaderboard</h3>
      <span class="meta" id="totale-montepremi"></span>
    </div>
    <div class="card-body" style="padding:0; overflow-x:auto;">
      <table class="leaderboard only-desktop" id="money-list-tabella">
        <thead>
          <tr><th class="num">Pos</th><th>Giocatore</th><th class="num">Hcp</th><th class="num">Scatolette</th></tr>
        </thead>
        <tbody></tbody>
      </table>
      <div class="only-mobile mobile-rows" id="money-list-mobile" style="padding:0 4px;"></div>
    </div>
  </section>
</main>

<footer class="site-footer">
  <div class="wrap">
    <span>Golf & Friends — sito del gruppo, gestito tra amici.</span>
    <span>Dati modificabili in <code>/data/data.json</code></span>
  </div>
</footer>

<script src="js/common.js?v=45"></script>
<script>
(async function () {
  document.getElementById("money-list-titolo").textContent = "Golf & Friends";
  document.getElementById("money-list-stagione").textContent = `Season ${new Date().getFullYear()}`;
  const data = await loadData();
  const ranked = calcolaScatoletteTotali(data, true);

  const totaleScatolette = ranked.reduce((sum, r) => sum + r.totale, 0);
  document.getElementById("totale-montepremi").textContent = `Scatolette assegnate in stagione: ${totaleScatolette}`;

  const tbody = document.querySelector("#money-list-tabella tbody");
  const classiPosizione = { 1: "gold", 2: "silver", 3: "bronze" };

  tbody.innerHTML = ranked
    .map((r, i) => {
      const pos = i + 1;
      const player = data.giocatori.find((g) => g.id === r.giocatore);
      const nome = player ? player.nome : r.giocatore;
      const classePos = classiPosizione[pos] || "plain";
      const premioCella =
        r.totale > 0
          ? `<span class="premio-badge">
               <span class="lb-scatolette-num">${r.totale}</span>
               <img src="img/scatola-provv1.png" alt="Scatola Titleist Pro V1" class="premio-thumb">
             </span>`
          : `<span class="muted">0</span>`;
      return `
      <tr class="lb-row">
        <td class="num"><span class="lb-pos ${classePos}">${pos}</span></td>
        <td>
          <div class="lb-player">
            <span class="lb-avatar">${inizialiGiocatore(nome)}</span>
            <span class="lb-nome player-name">${nome}</span>
          </div>
        </td>
        <td class="num">${player ? player.handicap.toFixed(1) : "—"}</td>
        <td class="num">${premioCella}</td>
      </tr>`;
    })
    .join("");

  document.getElementById("money-list-mobile").innerHTML = ranked
    .map((r, i) => {
      const pos = i + 1;
      const player = data.giocatori.find((g) => g.id === r.giocatore);
      const nome = player ? player.nome : r.giocatore;
      const classePos = classiPosizione[pos] || "plain";
      const premioCella =
        r.totale > 0
          ? `<span class="premio-badge">
               <span class="lb-scatolette-num">${r.totale}</span>
               <img src="img/scatola-provv1.png" alt="Scatola Titleist Pro V1" class="premio-thumb">
             </span>`
          : `<span class="muted">0</span>`;
      return `
      <div class="mrow">
        <div class="mrow-pos"><span class="lb-pos ${classePos}">${pos}</span></div>
        <div class="mrow-main">
          <div class="mrow-nome player-name">${nome}</div>
          <div class="mrow-sub">Hcp ${player ? player.handicap.toFixed(1) : "—"}</div>
        </div>
        <div class="mrow-side">${premioCella}</div>
      </div>`;
    })
    .join("");
})();
</script>
</body>
</html>
